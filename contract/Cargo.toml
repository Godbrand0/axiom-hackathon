[package]
name = "axiom-pay"
version = "0.1.0"
edition = "2021"
description = "Axiom Pay: policy-limited agent wallet, pay-per-call service registry with on-chain receipts, and signal commitments for a verifiable track record."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
